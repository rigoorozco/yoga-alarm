monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_output.platform-sound.HiFi__Speaker__sink"
      }
      {
        node.name = "alsa_output.platform-sound.HiFi__Headphones__sink"
      }
    ]

    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 48000
        audio.channels = 2
      }
    }
  }
]
